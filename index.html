<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conic Gradient Holographic Effect</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #card {
    width: 100%;
    height: 100%;
    /* conic-gradientを使用してホログラフィックカードのような色合いを実現 */
    background-image: repeating-conic-gradient(from 0deg, #ff7eb3 0%, #ff65a3 16%, #7afcff 33%, #feff9c 50%, #ff7eb3 67%, #ff65a3 83%, #7afcff 100%);
    background-size: 40px 40px;
    transition: background-image 0.5s;
  }
  #permission {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 20px;
  }
</style>
</head>
<body>

<div id="card"></div>
<div id="permission">
  <button onclick="requestOrientationPermission()">Click to Enable Device Orientation</button>
</div>

<script>
  function requestOrientationPermission() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            document.getElementById('permission').style.display = 'none';
          } else {
            alert("Permission not granted for Device Orientation");
          }
        })
        .catch(console.error);
    } else {
      window.addEventListener('deviceorientation', handleOrientation, true);
      document.getElementById('permission').style.display = 'none';
    }
  }

  function handleOrientation(event) {
    const rotation = event.alpha / 2 + event.beta / 2 + event.gamma * 2;

    // 計算した角度に基づいてbackground-imageを更新
    document.getElementById('card').style.backgroundImage = `repeating-conic-gradient(from ${rotation}deg, #ff7eb3 0%, #ff65a3 16%, #7afcff 33%, #feff9c 50%, #ff7eb3 67%, #ff65a3 83%, #7afcff 100%)`;
  }

  window.onload = function() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      document.getElementById('permission').style.display = 'flex';
    } else {
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
  };
</script>
</body>
</html>
